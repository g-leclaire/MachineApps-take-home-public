syntax = "proto3";
package vention.app.v1;

import "google/protobuf/empty.proto";


message TargetPositions {
  repeated double cube_position = 1;
  repeated double destination_position = 2;
}

message StateResponse {
  string state = 1;
  string last_state = 2;
}

message HistoryEntry {
  string timestamp = 1;
  string state = 2;
  int32 duration_ms = 3;
}

message HistoryResponse {
  repeated HistoryEntry history = 1;
  int32 buffer_size = 2;
}

message TriggerResponse {
  string result = 1;
  string previous_state = 2;
  string new_state = 3;
}

message Telemetry {
  string state = 1;
  string error = 2;
  repeated double position = 3;
  bool gripper_closed = 4;
  bool moving = 5;
}

service GantryPickAndPlaceService {
  rpc get_target_positions (google.protobuf.Empty) returns (TargetPositions);
  rpc set_target_positions (TargetPositions) returns (TargetPositions);
  rpc GetState (google.protobuf.Empty) returns (StateResponse);
  rpc GetHistory (google.protobuf.Empty) returns (HistoryResponse);
  rpc Trigger_Home (google.protobuf.Empty) returns (TriggerResponse);
  rpc Trigger_Begin_sequence (google.protobuf.Empty) returns (TriggerResponse);
  rpc TelemetryStream (google.protobuf.Empty) returns (stream Telemetry);
}
